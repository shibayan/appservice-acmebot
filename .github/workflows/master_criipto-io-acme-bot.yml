# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy dotnet core app to Azure Function App - criipto-io-acme-bot

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.' # set this to the path to your web app project, defaults to the repository root
  # SDK 9 is required to restore: the SDK 8 NuGet resolver rejects (NU1107) the
  # Microsoft.Extensions.Logging constraint mismatch between the ACMESharpCore
  # submodule and Durable Task, which SDK 9 tolerates (NU1608). The app still
  # targets net8.0.
  DOTNET_VERSION: '9.0.x'

jobs:
  build-and-deploy:
    runs-on: windows-latest
    steps:
    - name: 'Checkout GitHub Action'
      uses: actions/checkout@master
      with:
        submodules: true

    - name: Setup DotNet ${{ env.DOTNET_VERSION }} Environment
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 'Resolve Project Dependencies Using Dotnet'
      shell: pwsh
      run: |
        pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
        # Publish the function project only. Building the whole solution with --output
        # merges the restore graphs of AppService.Acmebot and the ACMESharpCore submodule,
        # escalating their Microsoft.Extensions.Logging version mismatch to NU1107.
        # Publish (not build) matches the payload produced by scripts/build-package.ps1.
        dotnet publish ./AppService.Acmebot/AppService.Acmebot.csproj --configuration Release --output ./output
        popd

    - name: 'Run Azure Functions Action'
      uses: Azure/functions-action@v1
      id: fa
      with:
        app-name: 'criipto-io-acme-bot'
        slot-name: 'production'
        package: '${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/output'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_8a5bcb0cd4dd4f6fba17c35e5ecf729b }}
  